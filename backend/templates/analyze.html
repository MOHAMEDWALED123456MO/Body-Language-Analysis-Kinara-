{% extends "base_app.html" %}
{% block content %}
<div class="pg-head"><div><h1 data-i18n="an_h"></h1><p class="sub" data-i18n="an_lead"></p></div></div>
<ol class="stepper" id="stepper"><li data-i18n="wz_1"></li><li data-i18n="wz_2"></li><li data-i18n="wz_3"></li></ol>
<div id="alert" class="alert" role="alert" hidden></div>
<section class="step card" data-step="1">
  <h2 data-i18n="sc_h"></h2><p class="sub" data-i18n="sc_sub"></p>
  <div id="scn" class="scn" role="radiogroup"></div>
  <div class="wz-nav"><button class="btn" type="button" data-go="2" data-i18n="wz_next"></button></div>
</section>
<section class="step card" data-step="2" hidden>
  <h2 data-i18n="goal_l"></h2>
  <textarea id="goal" class="goal" rows="3" maxlength="300"></textarea>
  <h3 data-i18n="pp_h"></h3>
  <p class="fine" data-i18n="pp_sub"></p>
  <div id="pp-log" class="ch-log" aria-live="polite"></div>
  <div id="pp-chips" class="ch-chips"></div>
  <form id="pp-form" class="ch-form" autocomplete="off">
    <input id="pp-input" type="text" maxlength="1000">
    <button class="btn" type="submit" data-i18n="ch_send"></button>
  </form>
  <p id="pp-err" class="fine" hidden></p>
  <div class="wz-nav"><button class="btn ghost" type="button" data-go="1" data-i18n="wz_back"></button><button class="btn" type="button" data-go="3" data-i18n="wz_next"></button></div>
</section>
<section class="step" data-step="3" hidden>
  <div class="two">
    <div class="card pick"><span class="pick-i">●</span>
      <button id="rec-open" class="drop rec-open" type="button"><strong data-i18n="rec_open"></strong><span data-i18n="rec_open_s"></span></button></div>
    <div class="card pick"><span class="pick-i">⇪</span>
      <button id="drop" class="drop" type="button"><strong data-i18n="drop_t"></strong><span data-i18n="drop_s"></span></button></div>
  </div>
  <input id="file" type="file" accept="video/*,.mkv" hidden>
  <div id="rec" class="rec card" hidden>
    <div class="rec-stage"><video id="rec-vid" playsinline muted></video><div id="live-hint" class="live-hint" role="status" aria-live="polite" hidden></div></div>
    <label class="live-opt"><input type="checkbox" id="live-on" checked> <span data-i18n="live_on"></span></label>
    <div class="rec-bar">
      <span id="rec-time" class="rec-time" dir="ltr">0:00</span>
      <button id="rec-start" class="btn" type="button" data-i18n="rec_start"></button>
      <button id="rec-stop" class="btn" type="button" hidden data-i18n="rec_stop"></button>
      <button id="rec-use" class="btn" type="button" hidden data-i18n="rec_use"></button>
      <button id="rec-retake" class="btn ghost" type="button" hidden data-i18n="rec_retake"></button>
      <button id="rec-close" class="btn ghost" type="button" data-i18n="rec_close"></button>
    </div>
    <p id="rec-note" class="fine"></p>
  </div>
  <div id="up" class="prog" hidden><div class="track"><i id="upbar"></i></div><p id="uptext"></p></div>
  <div class="wz-nav"><button class="btn ghost" type="button" data-go="2" data-i18n="wz_back"></button></div>
</section>
<ul id="recent" hidden></ul>
{% endblock %}
{% block scripts %}<script>window.SCENARIOS = {{ scenarios|tojson }};</script><script src="/static/analyze.js"></script><script src="/static/wizard.js"></script><script src="/static/prep.js"></script><script src="/static/record.js"></script>{% endblock %}
