{% extends "base.html" %}
{% block content %}
<section class="hero">
  <div class="hero-text">
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="cta-row">
      <a class="btn" href="/analyze" data-i18n="cta1"></a>
      <a class="btn ghost" href="#how" data-i18n="cta2"></a>
    </div>
  </div>
  <div class="scan" aria-hidden="true">
    <svg viewBox="0 0 300 360">
      <g class="bones">
        <line x1="150" y1="70" x2="150" y2="110"/>
        <line x1="90" y1="120" x2="210" y2="120"/>
        <line x1="90" y1="120" x2="60" y2="200"/><line x1="60" y1="200" x2="80" y2="270"/>
        <line x1="210" y1="120" x2="240" y2="200"/><line x1="240" y1="200" x2="220" y2="270"/>
        <line x1="90" y1="120" x2="110" y2="250"/><line x1="210" y1="120" x2="190" y2="250"/>
        <line x1="110" y1="250" x2="190" y2="250"/>
      </g>
      <circle class="head" cx="150" cy="45" r="26"/>
      <g class="joints">
        <circle cx="150" cy="110" r="5"/><circle cx="90" cy="120" r="6"/><circle cx="210" cy="120" r="6"/>
        <circle cx="60" cy="200" r="6"/><circle cx="240" cy="200" r="6"/>
        <circle cx="80" cy="270" r="6"/><circle cx="220" cy="270" r="6"/>
        <circle cx="110" cy="250" r="5"/><circle cx="190" cy="250" r="5"/>
      </g>
      <rect class="sweep" x="20" y="0" width="260" height="3"/>
    </svg>
    <span class="chip c1" data-i18n="chip1"></span>
    <span class="chip c2" data-i18n="chip2"></span>
    <span class="chip c3" data-i18n="chip3"></span>
  </div>
</section>

<section id="features" class="sec">
  <h2 data-i18n="feat_h"></h2>
  <div class="grid">
    <article><h3 data-i18n="f1t"></h3><p data-i18n="f1d"></p></article>
    <article><h3 data-i18n="f2t"></h3><p data-i18n="f2d"></p></article>
    <article><h3 data-i18n="f3t"></h3><p data-i18n="f3d"></p></article>
    <article><h3 data-i18n="f4t"></h3><p data-i18n="f4d"></p></article>
  </div>
</section>

<section id="how" class="sec">
  <h2 data-i18n="how_h"></h2>
  <ol class="steps">
    <li><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></li>
    <li><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></li>
    <li><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></li>
  </ol>
</section>

<section id="faq" class="sec">
  <h2 data-i18n="faq_h"></h2>
  <div class="faq">
    <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
    <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
    <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
    <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
  </div>
</section>

<section class="sec note">
  <p data-i18n="science"></p>
</section>
{% endblock %}
