{% extends "base_app.html" %}
{% block content %}
<div id="state"></div>
<div id="view" hidden>
  <div class="pg-head">
    <div><h1 id="title"></h1><div id="meta" class="meta"></div></div>
    <div class="actions">
      <a class="btn" id="rep-link" href="/report/{{ job_id }}" target="_blank" rel="noopener" data-i18n="res_report"></a>
      <a class="btn ghost" href="/new" data-i18n="res_new"></a>
      <button id="del" class="btn ghost danger" type="button" data-i18n="res_delete"></button>
    </div>
  </div>
  <div class="ws">
    <section class="card vidcard">
      <div class="pl" id="pl"><video id="vid" playsinline preload="metadata"></video></div>
      <p id="vidnote" class="fine" hidden></p>
    </section>
    <section class="card chatcard">
      <div class="chat-in">
        <h2 data-i18n="res_chat"></h2>
        <p id="ch-engine" class="fine"></p>
        <div id="ch-log" class="ch-log" aria-live="polite"></div>
        <div id="ch-chips" class="ch-chips"></div>
        <form id="ch-form" class="ch-form" autocomplete="off">
          <input id="ch-input" type="text" maxlength="1000">
          <button id="ch-send" class="btn" type="submit" data-i18n="ch_send"></button>
          <button id="ch-clear" class="btn ghost" type="button" data-i18n="ch_clear"></button>
        </form>
        <div id="ch-alert" class="alert err" hidden></div>
      </div>
      <div id="chat" hidden></div>
    </section>
    <section class="card tlcard">
      <h2 data-i18n="res_timeline"></h2>
      <div id="timeline" class="tl"></div>
    </section>
    <section class="card ancard">
      <h2 data-i18n="res_coach"></h2>
      <div id="score" class="score"></div>
      <div id="coach" class="scroll"></div>
    </section>
    <details class="card"><summary data-i18n="res_signals"></summary><div id="table"></div></details>
    <section class="card c3"><h2 data-i18n="res_voice"></h2><div id="voice"></div></section>
    <section class="card c3"><h2 data-i18n="res_moments"></h2><ol id="moments" class="moments"></ol></section>
    <section class="card c3" id="transcript-box" hidden>
      <h2 data-i18n="res_transcript"></h2><p id="tr-meta" class="fine"></p><ol id="transcript" class="transcript"></ol>
    </section>
  </div>
  <p id="adj" class="fine"></p>
  <p class="fine" data-i18n="science"></p>
</div>
<script>window.JOB_ID = "{{ job_id }}"; window.SIGNALS = {{ signals|tojson }}; window.SCENARIOS = {{ scenarios|tojson }}; window.VOICE_SIGNALS = {{ voice_signals|tojson }};</script>
{% endblock %}
{% block scripts %}<script src="/static/player.js"></script><script src="/static/results.js"></script>{% endblock %}
